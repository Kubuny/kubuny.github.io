<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kubuny</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #fde2e4, #e2ecfd);
      color: #333;
    }
    .card {
      background: #fff;
      padding: 48px 40px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 360px;
      width: 85%;
    }
    h1 { margin: 0; font-size: 2rem; }
    .sub { margin: 4px 0 24px; color: #888; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      background: #f6f6f8;
      margin: 10px 0;
      padding: 12px;
      border-radius: 12px;
    }
    a { display: inline-block; margin-top: 24px; color: #0969da; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>くぶにー</h1>
    <p class="sub">Kubuny</p>
    <ul>
      <li>💻 プログラム初心者</li>
      <li>🐰 チバニーが好き</li>
    </ul>
    <a href="https://github.com/Kubuny">GitHub →</a>
  </div>
</body>
</html>
